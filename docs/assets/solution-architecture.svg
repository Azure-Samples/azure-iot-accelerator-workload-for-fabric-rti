    <rect x="349" y="500" width="68" height="28" rx="5" fill="#eef9fb" stroke="#7bd0d7"/>
    <text x="383" y="512" text-anchor="middle" class="tiny">SQL</text>
    <text x="383" y="522" text-anchor="middle" class="tiny">processing</text>
    <rect x="424" y="500" width="55" height="28" rx="5" fill="#eef9fb" stroke="#7bd0d7"/>
    <text x="451" y="512" text-anchor="middle" class="tiny">KQL</text>
    <text x="451" y="522" text-anchor="middle" class="tiny">destination</text>
