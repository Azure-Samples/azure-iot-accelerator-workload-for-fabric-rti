  <text x="570" y="435" transform="rotate(-90 570 435)" class="small" font-style="italic" fill="#d83b01">update policy</text>

  <path d="M900 510 V610" fill="none" stroke="#d83b01" stroke-width="2.5"
        marker-end="url(#arrow-orange)"/>
  <text x="912" y="565" class="small" font-style="italic" fill="#d83b01">property lookup</text>

  <!-- Data Agent -->
  <g filter="url(#shadow)">
    <rect x="1080" y="135" width="220" height="78" rx="10" fill="#ffffff" stroke="#d83b01" stroke-width="2"/>
