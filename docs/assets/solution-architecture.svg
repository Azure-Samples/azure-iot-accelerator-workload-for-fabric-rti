<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow-blue" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#4f5bd5"/>
    </marker>
    <marker id="arrow-cyan" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#00a8b5"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#107c10"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#d83b01"/>
    </marker>
    <marker id="arrow-pink" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#e3008c"/>
    </marker>
    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; fill: #242424; }
      .title { font-size: 17px; font-weight: 700; fill: #ffffff; }
      .section-title { font-size: 14px; font-weight: 700; fill: #ffffff; }
      .box-title { font-size: 14px; font-weight: 700; }
      .body { font-size: 12px; }
      .small { font-size: 10px; }
      .tiny { font-size: 9px; }
      .label { font-size: 11px; font-weight: 600; }
    </style>
  </defs>

  <rect width="1400" height="850" fill="#ffffff"/>

  <!-- Fabric workspace boundary -->
  <rect x="520" y="40" width="850" height="775" rx="18" fill="#fbfaff" stroke="#b9a7e8"
