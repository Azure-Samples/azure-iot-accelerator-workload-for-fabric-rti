    <text x="340" y="194" text-anchor="middle" class="tiny">TwinChangeEvents</text>

    <rect x="58" y="225" width="165" height="50" rx="7" fill="#eef9fb" stroke="#00a8b5"/>
    <text x="140" y="244" text-anchor="middle" class="small" fill="#007c87">Custom endpoint</text>
    <text x="140" y="261" text-anchor="middle" class="tiny">fabric-telemetry-{suffix}</text>

    <rect x="257" y="225" width="165" height="50" rx="7" fill="#eef9fb" stroke="#00a8b5"/>
