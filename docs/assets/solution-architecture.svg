    <rect x="94" y="500" width="68" height="28" rx="5" fill="#eef9fb" stroke="#7bd0d7"/>
    <text x="128" y="512" text-anchor="middle" class="tiny">SQL</text>
    <text x="128" y="522" text-anchor="middle" class="tiny">processing</text>
