    <text x="235" y="69" text-anchor="middle" class="small" fill="#616161">Connected devices and sensors</text>
  </g>
  <path d="M235 85 L235 112" stroke="#4f5bd5" stroke-width="2.5" marker-end="url(#arrow-blue)"/>

  <!-- Azure IoT Hub -->
  <g filter="url(#shadow)">
