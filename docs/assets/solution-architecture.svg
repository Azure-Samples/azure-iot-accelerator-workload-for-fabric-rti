  <g filter="url(#shadow)">
    <rect x="1040" y="625" width="275" height="100" rx="10" fill="#ffffff" stroke="#d83b01" stroke-width="2"/>
    <path d="M1050 625 H1305 A10 10 0 0 1 1315 635 V658 H1040 V635 A10 10 0 0 1 1050 625 Z" fill="#d83b01"/>
    <text x="1178" y="648" text-anchor="middle" class="section-title">Fabric Activator</text>
