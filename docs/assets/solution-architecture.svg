    <text x="1178" y="463" text-anchor="middle" class="section-title">Eventstream: Activator</text>
    <text x="1178" y="495" text-anchor="middle" class="small">ActivatorStream_ThermoPro</text>
    <rect x="1060" y="513" width="66" height="24" rx="5" fill="#eef9fb" stroke="#7bd0d7"/>
    <text x="1093" y="529" text-anchor="middle" class="tiny">KQL source</text>
    <rect x="1138" y="513" width="66" height="24" rx="5" fill="#eef9fb" stroke="#7bd0d7"/>
    <text x="1171" y="529" text-anchor="middle" class="tiny">Schema</text>
    <rect x="1216" y="513" width="79" height="24" rx="5" fill="#fff2eb" stroke="#e89b7b"/>
    <text x="1255" y="529" text-anchor="middle" class="tiny">Activator</text>
