    <rect x="58" y="165" width="165" height="38" rx="7" fill="#eef5ff" stroke="#6aa9e9"/>
    <text x="140" y="180" text-anchor="middle" class="small" fill="#0067b8">Route</text>
    <text x="140" y="194" text-anchor="middle" class="tiny">DeviceMessages</text>

    <rect x="257" y="165" width="165" height="38" rx="7" fill="#eef5ff" stroke="#6aa9e9"/>
