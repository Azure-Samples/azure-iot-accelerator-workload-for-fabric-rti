  <rect x="996" y="754" width="105" height="30" rx="7" fill="#fff7f3" stroke="#e89b7b"/>
  <text x="1048" y="774" text-anchor="middle" class="small">Power Automate</text>
  <path d="M1178 725 L1178 754" stroke="#d83b01" stroke-width="2" marker-end="url(#arrow-orange)"/>
  <path d="M1178 735 C1178 744 1292 744 1292 754" fill="none" stroke="#d83b01" stroke-width="2"
